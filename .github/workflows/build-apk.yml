name: Build JARVIS Mk.II APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-20.04

    steps:
      - name: Checkout
        uses: actions/checkout@v2

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip openjdk-8-jdk python3-pip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev build-essential

      - name: Install buildozer
        run: |
          pip3 install --upgrade pip==20.3.4
          pip3 install Cython==0.29.19
          pip3 install buildozer==1.4.0
          buildozer --version

      - name: Build APK
        run: |
          buildozer android debug
        timeout-minutes: 120

      - name: Upload APK
        uses: actions/upload-artifact@v2
        with:
          name: jarvis-apk
          path: bin/*.apk
