name: Build JARVIS Mk.II APK

on:
  push:
    branches: [main]
  workflow_dispatch:  # Manual trigger

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip openjdk-17-jdk python3-pip autoconf libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev \
            build-essential ccache libsqlite3-dev sqlite3 bzip2 libbz2-dev libreadline-dev \
            liblzma-dev

      - name: Install buildozer and dependencies
        run: |
          pip3 install --upgrade pip
          pip3 install Cython==0.29.33 virtualenv
          pip3 install buildozer
          buildozer --version

      - name: Build APK
        run: |
          buildozer android debug
        timeout-minutes: 120

      - name: Upload APK artifact
        uses: actions/upload-artifact@v3
        with:
          name: jarvis-mk2-apk
          path: bin/*.apk
          retention-days: 30
          if-no-files-found: error
