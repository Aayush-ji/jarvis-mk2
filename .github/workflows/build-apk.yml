name: Build JARVIS Mk.II APK

on:
  push:
    branches: [main]
  workflow_dispatch:  # Manual trigger

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip zip git python3-pip build-essential libffi-dev libssl-dev libltdl-dev

      - name: Install buildozer
        run: |
          pip3 install --break-system-packages buildozer==1.5.0 cython==0.29.36
          buildozer --version

      - name: Build APK
        run: |
          buildozer -v android debug 2>&1 | tail -60

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-mk2-apk
          path: bin/*.apk
          retention-days: 30
          if-no-files-found: error
