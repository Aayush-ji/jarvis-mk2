version: "3.9"

services:
  jarvis:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: jarvis-relay
    env_file:
      - .env
    ports:
      - "8765:8765"
    volumes:
      - ./jarvis.db:/app/jarvis.db
    restart: unless-stopped
    depends_on:
      - redis
    networks:
      - jarvis-net

  redis:
    image: redis:7-alpine
    container_name: jarvis-redis
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    restart: unless-stopped
    networks:
      - jarvis-net

  nginx:
    image: nginx:alpine
    container_name: jarvis-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/jarvis.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs:/etc/nginx/certs:ro
    depends_on:
      - jarvis
    restart: unless-stopped
    networks:
      - jarvis-net

networks:
  jarvis-net:
    driver: bridge

volumes:
  redis_data:
